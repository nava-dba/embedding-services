ui:
  port: ""
  image: localhost/catalog-ui:local

backend:
  port: ""
  image: localhost/ai-services:local
  runtime: ""
  adminPasswordHash: ""
  # @generate:password length=32, special=false
  dbEncryptionKey: ""
  # @generate:password length=32, special=false
  mtlsEncryptionKey: ""
  # workerGatewayPort: port for the gRPC worker gateway. Always active; default is 9090.
  workerGatewayPort: "9090"
  # localWorker: when "true" the catalog-backend self-preregisters as the Local worker on startup.
  localWorker: "true"
  podman:
    uri: "/run/podman/podman.sock"
    authFileContent: ""

db:
  port: ""
  image: localhost/postgres:local
  user: "postgres"
  database: "ai_services"
  password: ""
  resources:
    requests:
      memory: "512Mi"
    limits:
      memory: "1Gi"

caddy:
  image: localhost/caddy:local
  adminPort: ""
  httpsPort: ""
  # caddyFileContent: Generated from the 'Caddyfile.tmpl' template
  caddyFileContent: ""
  # Populated from the certificate content specified via '--ssl-cert' during catalog configuration
  sslCertContent: ""
  # Populated from the private key content specified via '--ssl-key' during catalog configuration
  sslKeyContent: ""
